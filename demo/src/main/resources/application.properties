# ===================================================================
# OFFICIAL MYSQL DATABASE PLATFORM CONFIGURATION SETTINGS
# ===================================================================

# 1. Connection Path Endpoint String (Auto-generates schema database tables structure workspace)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/aims_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# 2. Database Server Connection Credentials (Configured for standard blank root authorization access)
spring.datasource.username=root
spring.datasource.password=

# 3. Hibernate Object Relational Data Layer Management Dialects
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. Spring Thymeleaf Presentation Engine Caching Bypass Optimization
spring.thymeleaf.cache=false
